<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">先払い買取の流れ</text>
  
  <!-- ステップ1: 申し込み・査定 -->
  <g>
    <rect x="250" y="80" width="300" height="100" rx="15" fill="#4c6ef5" stroke="#364fc7" stroke-width="3"/>
    <text x="400" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">ステップ1</text>
    <text x="400" y="140" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">申し込み・査定</text>
    <text x="400" y="165" font-family="Arial, sans-serif" font-size="14" fill="#dbe4ff" text-anchor="middle">商品の写真を送って査定</text>
  </g>
  
  <!-- 矢印1 -->
  <g>
    <line x1="400" y1="180" x2="400" y2="230" stroke="#495057" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- ステップ2: 契約・入金 -->
  <g>
    <rect x="250" y="230" width="300" height="100" rx="15" fill="#51cf66" stroke="#37b24d" stroke-width="3"/>
    <text x="400" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">ステップ2</text>
    <text x="400" y="290" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">契約・入金</text>
    <text x="400" y="315" font-family="Arial, sans-serif" font-size="14" fill="#d3f9d8" text-anchor="middle">査定額に同意→即日振込</text>
  </g>
  
  <!-- 矢印2 -->
  <g>
    <line x1="400" y1="330" x2="400" y2="380" stroke="#495057" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- ステップ3: 商品発送 -->
  <g>
    <rect x="250" y="380" width="300" height="100" rx="15" fill="#ff8787" stroke="#fa5252" stroke-width="3"/>
    <text x="400" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">ステップ3</text>
    <text x="400" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">商品発送</text>
    <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" fill="#ffe3e3" text-anchor="middle">期日までに商品を発送</text>
  </g>
  
  <!-- 矢印3 -->
  <g>
    <line x1="400" y1="480" x2="400" y2="520" stroke="#495057" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- 完了 -->
  <g>
    <ellipse cx="400" cy="555" rx="120" ry="35" fill="#fcc419" stroke="#fab005" stroke-width="3"/>
    <text x="400" y="565" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">取引完了 ✓</text>
  </g>
  
  <!-- 注意事項 -->
  <g>
    <rect x="50" y="500" width="180" height="80" rx="10" fill="#fff3bf" stroke="#fcc419" stroke-width="2"/>
    <text x="140" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67700" text-anchor="middle">⚠️ 注意</text>
    <text x="140" y="545" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">期日までに必ず</text>
    <text x="140" y="560" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">商品を発送すること</text>
  </g>
  
  <!-- スピード表示 -->
  <g>
    <rect x="570" y="500" width="180" height="80" rx="10" fill="#d0ebff" stroke="#4c6ef5" stroke-width="2"/>
    <text x="660" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1971c2" text-anchor="middle">⏱️ スピード</text>
    <text x="660" y="545" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">最短即日入金</text>
    <text x="660" y="560" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">（業者により異なる）</text>
  </g>
  
  <!-- 矢印定義 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#495057"/>
    </marker>
  </defs>
</svg>
